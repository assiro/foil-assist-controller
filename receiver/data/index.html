<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TecnoFly – Foil Assist</title>
<style>
:root{--cy:#22d3ee;--cyd:rgba(34,211,238,0.15);--cyg:rgba(34,211,238,0.35);--dk:#050709;--pn:rgba(8,14,22,0.88);--bd:rgba(34,211,238,0.18);--tx:#e2e8f0;--mu:#64748b;--r:12px}
*,::after,::before{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI','Roboto',system-ui,sans-serif;background:var(--dk);color:var(--tx);overflow-x:hidden;-webkit-text-size-adjust:100%}
.bg-cf{position:fixed;inset:0;z-index:0;background:#1e1f20 url(fiber.jpg) repeat}
.bg-cf::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0,rgba(34,211,238,.04) 0,transparent 60%),linear-gradient(180deg,rgba(5,7,9,.35),rgba(5,7,9,.85))}
.sl{position:fixed;inset:0;z-index:2;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px);pointer-events:none}
.sh{position:relative;z-index:10;min-height:100dvh;max-width:480px;margin:0 auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px}
.hd{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 16px 16px;background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(12px);position:relative;overflow:hidden}
.hd::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--cy),transparent)}
.lg{width:200px;max-width:70%;height:auto;filter:drop-shadow(0 0 20px var(--cyg))}
.sb{display:flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--cyd)}
.sd{width:6px;height:6px;border-radius:50%;background:var(--cy);box-shadow:0 0 6px var(--cy);animation:pu 2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1;box-shadow:0 0 6px var(--cy)}50%{opacity:.5;box-shadow:0 0 2px var(--cy)}}
.st{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--cy);text-transform:uppercase}
.sbar{display:flex;align-items:center;gap:0;padding:12px 16px;background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(12px)}
.si{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}.si:first-child{flex:2}
.sdvr{width:1px;height:36px;background:var(--bd);flex-shrink:0}
.slbl{font-size:9px;font-weight:600;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase}
.sv{font-size:14px;font-weight:600;color:var(--tx)}
.sv.bg{font-size:20px;color:var(--cy)}
.bt{width:90%;height:6px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden}
.bf{height:100%;width:0;border-radius:999px;background:var(--cy);transition:width .4s ease,background .3s ease;box-shadow:0 0 6px currentColor}
.mg{display:flex;flex-direction:column;gap:10px}
.mb{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(12px);text-decoration:none;color:var(--tx);cursor:pointer;position:relative;overflow:hidden;transition:border-color .2s,background .2s,transform .15s;-webkit-tap-highlight-color:transparent}
.mb::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cy);transform:scaleY(0);transform-origin:bottom;transition:transform .2s ease;border-radius:0 2px 2px 0}
.mb::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--cyd),transparent 60%);opacity:0;transition:opacity .2s}
.mb:active{border-color:rgba(34,211,238,.4);transform:translateX(3px)}
.mb:active::before{transform:scaleY(1)}.mb:active::after{opacity:1}
.ic{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--cyd);border:1px solid var(--bd);border-radius:8px;color:var(--cy);position:relative;z-index:1}
.ic svg{width:18px;height:18px}
.bl{flex:1;font-size:17px;font-weight:600;letter-spacing:.5px;position:relative;z-index:1}
.ba{font-size:20px;color:var(--mu);position:relative;z-index:1;transition:color .2s,transform .2s}
.mb:active .ba{color:var(--cy);transform:translateX(3px)}
.ft{margin-top:auto;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-size:10px;color:var(--mu);letter-spacing:.5px}
.sp{color:rgba(100,116,139,.4)}.ft b{color:var(--cy);font-weight:500}
@media(min-width:600px){.sh{padding:32px 24px}.lg{width:260px}.mb{padding:16px 20px}.bl{font-size:19px}}

.record-card{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 16px 10px;background:linear-gradient(145deg,rgba(10,28,38,.96),rgba(8,14,22,.94));border:1px solid rgba(34,211,238,.28);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035);text-align:center;backdrop-filter:blur(12px)}
.record-card::before{content:'';position:absolute;top:0;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,#22d3ee,transparent)}
.record-kicker{font-size:22px;line-height:1.1;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cy)}
.record-title{font-size:12px;font-weight:650;letter-spacing:.2px;color:var(--tx)}
.record-time{font-size:clamp(28px,10vw,42px);line-height:1;font-weight:750;letter-spacing:3px;font-variant-numeric:tabular-nums;color:#4ade80;text-shadow:0 0 22px rgba(74,222,128,.18);padding:0}
.record-unit{font-size:13px;line-height:1.1;letter-spacing:1.4px;text-transform:uppercase;color:var(--mu)}
.record-note{font-size:14px;color:var(--mu);line-height:1.45}
.record-link{margin-top:3px;color:var(--cy);font-size:12px;text-decoration:none;font-weight:600}
.record-link:active{opacity:.7}
</style>
<script type="text/javascript">
    // Il firmware espone il record assoluto in secondi tramite /readRecord.
    // Usiamo fetch nativo: index.html non carica jQuery.
    async function fetchRecord() {
        const output = document.getElementById("absRecord");
        const status = document.getElementById("recordStatus");
        if (!output) return;

        try {
            const response = await fetch("/readRecord", { cache: "no-store" });
            if (!response.ok) throw new Error("HTTP " + response.status);

            const raw = await response.text();
            const secs = Number.parseInt(raw.trim(), 10);

            if (!Number.isFinite(secs) || secs <= 0) {
                output.textContent = "--:--";
                if (status) status.textContent = "No record stored yet";
                return;
            }

            const minutes = Math.floor(secs / 60);
            const seconds = secs % 60;
            output.textContent =
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");

            if (status) status.textContent = "Longest continuous foil session";
        } catch (error) {
            output.textContent = "--:--";
            if (status) status.textContent = "Record temporarily unavailable";
            console.warn("Unable to read foil record:", error);
        }
    }
</script>
</head>
<body>
<div class="bg-cf"></div>
<div class="sl"></div>
<main class="sh">
<header class="hd"><img src="tecnofly_logo.gif" alt="TecnoFly" class="lg"><div class="sb"><span class="sd"></span><span class="st">FOIL ASSIST SYSTEM</span></div></header>
<section class="sbar"><div class="si"><span class="slbl">BATTERY</span><div class="bt"><div id="bf" class="bf"></div></div><span id="bv" class="sv">--%</span></div><div class="sdvr"></div><div class="si"><span class="slbl">ROLL</span><span id="ro" class="sv bg">--°</span></div><div class="sdvr"></div><div class="si"><span class="slbl">PITCH</span><span id="pi" class="sv bg">--°</span></div></section>
<nav class="mg">
<a class="mb" href="rides.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div><div class="bl">Rides Data</div><div class="ba">›</div></a>
<a class="mb" href="setup.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14M14.12 2.05a10 10 0 0 1 0 19.9M9.88 2.05a10 10 0 0 0 0 19.9"/></svg></div><div class="bl">Settings</div><div class="ba">›</div></a>
<a class="mb" href="test.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2v7l3 3-3 3v7h20v-7l-3-3 3-3V2H2z"/><line x1="2" y1="9" x2="22" y2="9"/><line x1="2" y1="15" x2="22" y2="15"/></svg></div><div class="bl">Sensors Monitor</div><div class="ba">›</div></a>

</nav>
<!-- ALL-TIME BEST WAVE / PUMP & GLIDE -->
<section class="record-card" aria-label="All-time best foil session">
    <div class="record-kicker">🏆 Best Record</div>
<!--    <h2 class="record-title">All-time Best Wave / Pump &amp; Glide</h2>-->
    <div class="record-time" id="absRecord" aria-live="polite">--:--</div>
    <div class="record-unit">Minutes : Seconds</div>
<!--    <p class="record-note" id="recordStatus">Reading best time…</p>-->
</section>
<footer class="ft"><span>Written by Roberto Assiro</span><span class="sp">·</span><span>Firmware <b id="vr"></b></span><span class="sp">·</span><span>TecnoFly 2026</span></footer>
</main>
<script>
function ud(){fetch("/data").then(r=>r.json()).then(d=>{let v=parseInt(d.batpercentage);document.getElementById("bv").textContent=v+"%";let f=document.getElementById("bf");f.style.width=Math.min(v,100)+"%";f.style.background=v>60?"#22d3ee":v>30?"#fbbf24":"#f87171";document.getElementById("ro").textContent=Math.round(d.roll)+"°";document.getElementById("pi").textContent=Math.round(d.pitch)+"°"}).catch(()=>{})}
function fv(){fetch("/ver").then(r=>r.text()).then(t=>document.getElementById("vr").textContent=t).catch(()=>{})}
setInterval(ud,1e3);ud();fv();fetchRecord();setInterval(fetchRecord,30000);
</script>
</body>
</html>
